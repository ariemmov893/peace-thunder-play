    <title>Peace Thunder</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /*
        The loading screen. It is part of the page, so it is on show before the
        game's code has arrived, and what moves on it moves by transform alone:
        the browser keeps that going on its own while the page is busy making
        the world. main.ts names each step on it and fades it out over the
        first frame of the game.
      */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: #05070c;
        color: #eef3fa;
        font-family: Bahnschrift, 'DIN Alternate', 'Roboto Condensed', 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.5s ease;
      }
      #loader.done {
        opacity: 0;
        pointer-events: none;
      }
      /* (the logo: the same shapes the title screen draws, written here by `npm run logo`) */
      #loader .mark {
        width: min(620px, 76vw);
        height: auto;
        display: block;
      }
      #loader .track {
        position: relative;
        width: min(360px, 62vw);
        height: 2px;
        background: rgba(88, 255, 134, 0.16);
        overflow: hidden;
      }
      #loader .fill {
        position: absolute;
        inset: 0;
        background: #58ff86;
        transform-origin: left center;
        transform: scaleX(0);
        transition: transform 0.3s ease-out;
        will-change: transform;
      }
      #loader .glint {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 26%;
        background: linear-gradient(90deg, transparent, rgba(214, 255, 226, 0.95), transparent);
        animation: loader-sweep 1.3s linear infinite;
        will-change: transform;
      }
      @keyframes loader-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(385%);
        }
      }
      #loader .row {
        width: min(360px, 62vw);
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        letter-spacing: 0.3em;
        color: #58ff86;
      }
      #loader.failed .row {
        color: #ff6a5a;
      }
      #loader.failed .glint {
        animation: none;
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #loader .glint {
          animation: none;
          opacity: 0;
        }
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
        cursor: crosshair;
        outline: none;
      }
    </style>
